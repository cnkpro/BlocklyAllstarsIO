<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="changa.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
    <script src="jquery.min.js"></script>
    <script src="bundle.js"></script>
    <title>Blockly.IO</title>
</head>
<body>
    <canvas id="main-ui"></canvas>
    <div id="stats" style="opacity: 0" class="fullscreen hidden"></div>
    <div id="begin" style="opacity: .99999" class="fullscreen">
        <div class="center">
            <h1 id="logo" aria-label="Blockly.IO"><span class="tile tile-0">B</span><span class="tile tile-1">L</span><span class="tile tile-2">O</span><span class="tile tile-3">C</span><span class="tile tile-0">K</span><span class="tile tile-1">L</span><span class="tile tile-2">Y</span><span class="io">.IO</span></h1>
            
            <h1>Enter your name</h1>
            <input autocomplete="off" id="name" maxlength="32" placeholder="An awesome name!">
            <button type="submit">Play!</button>
            <div>
                <small id="error">Your browser does not support JavaScript!</small>
            </div>
            <small>Visit the open-source code on <a href="https://github.com/theKidOfArcrania/BlocklyIO">GitHub</a>!</small>
        </div>
    </div>
    <div id="dpad" aria-hidden="true">
        <button class="arrow up" data-heading="0">&#9650;</button>
        <button class="arrow left" data-heading="3">&#9664;</button>
        <button class="arrow right" data-heading="1">&#9654;</button>
        <button class="arrow down" data-heading="2">&#9660;</button>
    </div>
</body>
</html>
